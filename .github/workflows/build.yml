name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xenax-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: xenax-bridge/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile
        run: |
          VER="${GITHUB_REF_NAME}"
          mkdir -p dist
          build() { GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o "dist/$3" . ; }
          build windows amd64 xenax-bridge-windows-amd64.exe
          build windows arm64 xenax-bridge-windows-arm64.exe
          build darwin  arm64 xenax-bridge-macos-arm64
          build darwin  amd64 xenax-bridge-macos-amd64
          build linux   amd64 xenax-bridge-linux-amd64
          build linux   arm64 xenax-bridge-linux-arm64
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xenax-bridge
          path: xenax-bridge/dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xenax-bridge/dist/*

  webmotion-vnc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t webmotion-vnc webmotion-vnc
